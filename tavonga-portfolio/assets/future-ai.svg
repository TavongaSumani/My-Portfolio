<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Future AI project thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#090A12"/>
      <stop offset=".55" stop-color="#0B0D16"/>
      <stop offset="1" stop-color="#141737"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FF4FD8" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#A78BFA" stop-opacity=".85"/>
      <stop offset="1" stop-color="#6BE4FF" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="650" fill="url(#bg)"/>
  <rect x="44" y="44" width="1112" height="562" rx="28" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)" stroke-width="2"/>

  <g opacity=".20">
    <circle cx="220" cy="160" r="120" fill="rgba(255,79,216,.12)"/>
    <circle cx="330" cy="240" r="110" fill="rgba(167,139,250,.12)"/>
    <circle cx="470" cy="200" r="140" fill="rgba(107,228,255,.10)"/>
  </g>

  <g transform="translate(92 102)">
    <text x="0" y="0" fill="rgba(255,255,255,.92)" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="800">
      Future AI Project
    </text>
    <text x="0" y="30" fill="rgba(255,255,255,.68)" font-family="Inter,Segoe UI,Arial" font-size="16" font-weight="600">
      Chatbot � Summarizer � Smart assistant workflows
    </text>

    <g transform="translate(0 76)">
      <rect x="0" y="0" width="1016" height="424" rx="24" fill="rgba(0,0,0,.22)" stroke="rgba(255,255,255,.10)"/>

      <g transform="translate(22 22)">
        <rect x="0" y="0" width="972" height="62" rx="20" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.08)"/>
        <text x="18" y="40" fill="rgba(255,255,255,.86)" font-family="JetBrains Mono,Consolas,monospace" font-size="12" font-weight="800">
          ASSISTANT
        </text>
        <rect x="770" y="18" width="184" height="26" rx="13" fill="rgba(255,79,216,.10)" stroke="rgba(255,79,216,.22)"/>
        <text x="790" y="37" fill="rgba(255,255,255,.86)" font-family="JetBrains Mono,Consolas,monospace" font-size="12" font-weight="800">
          RUN
        </text>
      </g>

      <g transform="translate(22 108)">
        <rect x="0" y="0" width="640" height="294" rx="22" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)"/>
        <text x="18" y="30" fill="rgba(255,255,255,.72)" font-family="JetBrains Mono,Consolas,monospace" font-size="12" font-weight="800" letter-spacing=".12em">
          DIALOG
        </text>
        <g transform="translate(18 54)">
          <rect x="0" y="0" width="520" height="44" rx="18" fill="rgba(107,228,255,.10)" stroke="rgba(107,228,255,.22)"/>
          <text x="18" y="28" fill="rgba(255,255,255,.86)" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700">
            Summarize my notes into action items.
          </text>
        </g>
        <g transform="translate(18 110)">
          <rect x="0" y="0" width="580" height="76" rx="18" fill="rgba(167,139,250,.10)" stroke="rgba(167,139,250,.22)"/>
          <text x="18" y="30" fill="rgba(255,255,255,.86)" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700">
            Done. Here are 5 tasks and a 3-line summary.
          </text>
          <rect x="18" y="44" width="360" height="10" rx="5" fill="rgba(255,255,255,.10)"/>
          <rect x="18" y="60" width="310" height="10" rx="5" fill="rgba(255,255,255,.10)"/>
        </g>
        <g transform="translate(18 206)">
          <rect x="0" y="0" width="600" height="44" rx="18" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.10)"/>
          <text x="18" y="28" fill="rgba(255,255,255,.7)" font-family="JetBrains Mono,Consolas,monospace" font-size="12" font-weight="800">
            TYPE A PROMPT&
          </text>
        </g>
      </g>

      <g transform="translate(682 108)">
        <rect x="0" y="0" width="312" height="294" rx="22" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.08)"/>
        <text x="18" y="30" fill="rgba(255,255,255,.72)" font-family="JetBrains Mono,Consolas,monospace" font-size="12" font-weight="800" letter-spacing=".12em">
          MODULES
        </text>
        <g transform="translate(18 56)" filter="url(#glow)">
          <rect x="0" y="0" width="276" height="50" rx="18" fill="url(#accent)" opacity=".25"/>
          <text x="18" y="31" fill="rgba(255,255,255,.9)" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="800">
            Summarizer
          </text>
        </g>
        <g transform="translate(18 116)">
          <rect x="0" y="0" width="276" height="50" rx="18" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.10)"/>
          <text x="18" y="31" fill="rgba(255,255,255,.86)" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="800">
            Chatbot
          </text>
        </g>
        <g transform="translate(18 176)">
          <rect x="0" y="0" width="276" height="50" rx="18" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.10)"/>
          <text x="18" y="31" fill="rgba(255,255,255,.86)" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="800">
            Automation
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>
