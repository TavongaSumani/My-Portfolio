        <g transform="translate(18 150)">
          <rect x="0" y="0" width="296" height="92" rx="18" fill="rgba(0,0,0,.22)" stroke="rgba(255,255,255,.08)"/>
          <text x="16" y="30" fill="rgba(255,255,255,.7)" font-family="JetBrains Mono,Consolas,monospace" font-size="12" font-weight="800">SECTORS</text>
