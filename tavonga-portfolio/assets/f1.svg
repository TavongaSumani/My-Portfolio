        </g>

        <g transform="translate(18 98)">
          <text x="0" y="0" fill="rgba(255,255,255,.65)" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700">Driver B</text>
          <rect x="0" y="10" width="296" height="12" rx="6" fill="rgba(255,255,255,.08)"/>
          <rect x="0" y="10" width="224" height="12" rx="6" fill="rgba(167,139,250,.75)"/>
