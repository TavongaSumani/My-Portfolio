          <path d="M24 200 L600 200" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
          <path d="M24 152 L600 152" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
          <path d="M24 104 L600 104" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
