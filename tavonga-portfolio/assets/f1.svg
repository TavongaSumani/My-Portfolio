<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Formula 1 telemetry dashboard thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#05060A"/>
      <stop offset=".6" stop-color="#0E1020"/>
      <stop offset="1" stop-color="#141737"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6BE4FF" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#A78BFA" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FF4FD8" stop-opacity=".8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="650" fill="url(#bg)"/>
  <g opacity=".20">
    <path d="M-40 520 L1240 100" stroke="#6BE4FF" stroke-width="18"/>
    <path d="M-40 580 L1240 160" stroke="#64FFB7" stroke-width="10"/>
  </g>
  <rect x="44" y="44" width="1112" height="562" rx="28" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)" stroke-width="2"/>

  <g transform="translate(92 102)">
